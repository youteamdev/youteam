<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTeam</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe7;
      --ink: #18211f;
      --muted: #61706b;
      --accent: #df6f36;
      --card: #fffaf2;
      --line: #e1d4c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(223, 111, 54, 0.18), transparent 28rem),
        linear-gradient(135deg, #f9f3ea 0%, var(--bg) 46%, #e7f0ea 100%);
    }

    main {
      width: min(720px, 100%);
      padding: clamp(32px, 8vw, 72px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: color-mix(in srgb, var(--card) 90%, white);
      box-shadow: 0 24px 80px rgba(55, 38, 25, 0.14);
    }

    p.kicker {
      margin: 0 0 18px;
      color: var(--accent);
      font: 700 0.78rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 6.8rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p {
      max-width: 34rem;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.65;
    }

    code {
      padding: 0.18em 0.42em;
      border-radius: 8px;
      background: #efe4d6;
      color: var(--ink);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Embedded Web Server</p>
    <h1>YouTeam is running.</h1>
    <p>The built-in web server is serving this page from the Go binary. Configure it with <code>youteam.toml</code> or the <code>HOST</code> and <code>PORT</code> environment variables.</p>
  </main>
</body>
</html>
